name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Guard against next/font/google
        run: |
          set +e
          grep -rn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.mjs' --include='*.cjs' --include='*.mts' --include='*.cts' --exclude-dir=node_modules --exclude-dir=.next "next/font/google" .
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "next/font/google is not allowed, vendor the font (see src/fonts/README.md)"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "font guard: grep failed with exit $rc"; exit 1; fi
          echo "font guard: OK, no next/font/google import found"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Type check tests
        run: npm run type-check:tests

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          ADMIN_PASSWORD: ci-test
          JWT_SECRET: ci-test-secret-32-chars-minimum-ok
          NEXT_PUBLIC_DEFAULT_GATEWAY_URL: http://localhost:9500

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

  relay-config:
    # Parses .relay.yml with js-yaml the way agent-relay's loader reads it:
    # every pre_update/post_update entry must be a string, a hook key left
    # present with no items (null) is rejected, and no pre_update entry may
    # build images (pre_update runs pre-pull, so a build there builds the old
    # tree; the relay builds the pulled commit itself). Either mistake fails
    # every deploy on the server, so it fails CI first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/relay-config.test.sh

  docker-image:
    # Builds the production Dockerfile on every PR and push, without pushing it
    # anywhere, then smoke-tests the runner stage. The image is built on the
    # server at deploy time; a broken base tag or docker-ce-cli apt step used to
    # surface only there. The smoke checks avoid starting the app: docker-ce-cli
    # has to be installed (LogTail docker source) and the runtime has to be
    # Node 22. No build cache, so a cold cache is the only case.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --pull -t clawd-monitor-ci:${{ github.sha }} .
      - name: Smoke test runner stage
        run: |
          set -eu
          image="clawd-monitor-ci:${{ github.sha }}"
          docker run --rm --entrypoint docker "$image" --version
          node_major=$(docker run --rm --entrypoint node "$image" -p 'process.versions.node.split(".")[0]')
          echo "node major: $node_major"
          test "$node_major" = "22"
