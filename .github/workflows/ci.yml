name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Guard against next/font/google
        run: |
          set +e
          grep -rn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.mjs' --include='*.cjs' --exclude-dir=node_modules --exclude-dir=.next "next/font/google" .
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "next/font/google is not allowed, vendor the font (see src/fonts/README.md)"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "font guard: grep failed with exit $rc"; exit 1; fi
          echo "font guard: OK, no next/font/google import found"

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Type check tests
        run: npm run type-check:tests

      - name: Build
        run: npm run build
        env:
          ADMIN_PASSWORD: ci-test
          JWT_SECRET: ci-test-secret-32-chars-minimum-ok
          NEXT_PUBLIC_DEFAULT_GATEWAY_URL: http://localhost:9500

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
