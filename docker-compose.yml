# Simple deployment without Traefik (HTTP only, port 3000)
# For Traefik with TLS, use docker-compose.traefik.yml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - CLAWD_MONITOR_DATA_DIR=/data
    volumes:
      - clawd_monitor_data:/data
    env_file:
      - path: .env
        required: false
      - path: .env.runtime
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health', { signal: AbortSignal.timeout(4000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clawd_monitor_data:
    external: true
