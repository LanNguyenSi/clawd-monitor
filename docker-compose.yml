# Simple deployment without Traefik (HTTP only, port 3000), bound to 127.0.0.1.
# For Traefik with TLS, use docker-compose.traefik.yml

# A fixed project name: without it a bare `docker compose up -d` or `down` in
# this directory addresses the production stack (docker-compose.traefik.yml,
# run under the directory name, no project name), which shares service "app".
name: clawd-monitor-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - CLAWD_MONITOR_DATA_DIR=/data
      # The container is wired to 3000 by the port mapping below and the
      # healthcheck, so PORT/HOSTNAME are pinned here (compose environment:
      # wins over env_file): a PORT or HOSTNAME in .env must not move the
      # listener away from what the mapping reaches. They apply only outside
      # Docker; to change the published port, change the mapping above.
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - clawd_monitor_data:/data
    env_file:
      - path: .env
        required: false
      - path: .env.runtime
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health', { signal: AbortSignal.timeout(4000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clawd_monitor_data:
    external: true
