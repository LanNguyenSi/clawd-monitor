services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - CLAWD_MONITOR_DATA_DIR=/data
    volumes:
      - clawd_monitor_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - path: .env
        required: false
      - path: .env.runtime
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health', { signal: AbortSignal.timeout(4000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The socket is root:<docker group> 0660 on the host; the app runs as UID 1001
    # without that group and could not open it (empty Docker widget). Set
    # DOCKER_GID in .env to the host's value (stat -c %g /var/run/docker.sock);
    # 988 is the docker group on the production host. This is root-equivalent
    # control of the host's Docker daemon, see docs/configuration.md.
    group_add:
      - "${DOCKER_GID:-988}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clawd-monitor.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.clawd-monitor.entrypoints=websecure"
      - "traefik.http.routers.clawd-monitor.tls=true"
      - "traefik.http.routers.clawd-monitor.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clawd-monitor.tls.options=nohttp2@file"
      - "traefik.http.services.clawd-monitor.loadbalancer.server.port=3000"
    networks:
      - traefik

networks:
  traefik:
    external: true

volumes:
  clawd_monitor_data:
